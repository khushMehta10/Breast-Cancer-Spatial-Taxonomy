      - openslide-python==1.4.6
      - pandas==2.3.3
      - scikit-image==0.25.2
      - scikit-learn==1.7.2
      - scipy==1.15.3
      - shapely==2.1.2
      - tifffile==2025.5.10
      # Notebooks only:
      - networkx==3.4.2
      - seaborn==0.13.2
